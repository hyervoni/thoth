<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Thoth</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="fonts.css">
<style>
  :root {
    --bg: #0a0a0a;
    --ink: #f0ece4;
    --ink-soft: #a39a8c;
    --accent: #e74c3c;
    --line: #3a342b;
    --line-strong: #5a5043;
    --paper: #1a1714;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  button, input, textarea {
    color: inherit;
    font: inherit;
  }
  button, input[type="range"] {
    touch-action: manipulation;
  }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Fraunces', Georgia, serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top, 20px) 24px env(safe-area-inset-bottom, 20px);
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 4px 20px;
    border-bottom: 1px solid var(--line-strong);
  }
  .logo {
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.02em;
    font-variation-settings: "opsz" 144;
  }
  .logo span { color: var(--accent); font-style: italic; }
  .stats {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* Reader stage */
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    min-height: 0;
  }

  .word-frame {
    width: 100%;
    max-width: 720px;
    height: 200px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* The two horizontal guide marks */
  .word-frame::before,
  .word-frame::after {
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 1.5px;
    background: var(--accent);
  }
  .word-frame::before { top: 28px; }
  .word-frame::after { bottom: 28px; }

  .word {
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 500;
    /* Adaptive floor: shrinks from 40px down to 28px on narrow phones so
       4-syllable words like "computadora" or "investigación" fit with ORP
       intact. Above ~500px viewport the floor locks at 40 and behavior is
       the same as before. */
    font-size: min(72px, max(min(40px, max(28px, 8vw)), 7vw));
    letter-spacing: -0.005em;
    font-variation-settings: "opsz" 72;
    white-space: nowrap;
    position: relative;
  }
  .word .left {
    color: var(--ink);
  }
  .word .pivot {
    color: var(--accent);
  }
  .word .right {
    color: var(--ink);
  }
  .word .pivot-anchor {
    position: absolute;
    left: 50%;
    width: 0;
  }

  /* Progress bar */
  .progress {
    width: 100%;
    max-width: 720px;
    height: 3px;
    background: var(--line-strong);
    margin-top: 32px;
    position: relative;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.2s ease;
  }

  .progress-label {
    margin-top: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* Chapter bar — sits above the velocity slider, only when book has TOC */
  .chapter-bar {
    width: 100%;
    display: none;
    flex-direction: column;
    gap: 3px;
    padding: 4px 0 10px;
    background: transparent;
    border: none;
    cursor: pointer;
    text-align: left;
    transition: opacity 0.2s;
  }
  .chapter-bar.visible { display: flex; }
  .chapter-bar:hover { opacity: 0.7; }
  .chapter-bar:active { opacity: 0.45; }
  .chapter-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .book-title-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .chapter-counter { flex-shrink: 0; }
  .chapter-title-text {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* TOC panel */
  .toc-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    margin: -4px;
    padding: 4px;
  }
  .toc-item {
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 18px 4px;
    cursor: pointer;
    display: flex;
    align-items: baseline;
    gap: 14px;
    transition: background 0.15s;
  }
  .toc-item:hover { background: rgba(255, 255, 255, 0.03); }
  .toc-item:active { background: rgba(255, 255, 255, 0.06); }
  .toc-item .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
    min-width: 28px;
    flex-shrink: 0;
  }
  .toc-item .label {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    color: var(--ink);
    line-height: 1.4;
    flex: 1;
    min-width: 0;
  }
  .toc-item.current .num { color: var(--accent); font-weight: 600; }
  .toc-item.current .label { color: var(--accent); font-style: italic; font-weight: 500; }
  .toc-item .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
    flex-shrink: 0;
  }

  /* Bookmarks */
  .add-bookmark-btn {
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 18px 24px;
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.01em;
    cursor: pointer;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: transform 0.15s, background 0.15s;
  }
  .add-bookmark-btn:active { transform: scale(0.98); background: var(--accent); }
  .add-bookmark-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    background: var(--line-strong);
    color: var(--ink-soft);
  }
  .bookmark-row {
    display: flex;
    align-items: stretch;
    border-bottom: 1px solid var(--line);
  }
  .bookmark-row:hover { background: rgba(255, 255, 255, 0.03); }
  .bookmark-item {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    padding: 18px 4px;
    cursor: pointer;
    display: flex;
    align-items: baseline;
    gap: 14px;
    text-align: left;
    color: var(--ink);
  }
  .bookmark-item .label {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    line-height: 1.4;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bookmark-item .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
    flex-shrink: 0;
  }
  .bookmark-item .icon {
    font-size: 16px;
    flex-shrink: 0;
    opacity: 0.85;
  }
  .bookmark-delete {
    background: transparent;
    border: none;
    padding: 0 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: color 0.15s;
  }
  .bookmark-delete:hover { color: var(--accent); }
  .book-item {
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
  }
  /* Titles wrap instead of the ellipsis truncation .bookmark-item .label
     uses elsewhere — long titles must wrap per spec, and without this the
     column layout's shrink-to-fit sizing lets nowrap text overflow the row. */
  .book-item .label {
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
  }
  .book-item .sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
  }
  .book-item.current .label { color: var(--accent); font-style: italic; }
  .bookmark-empty {
    padding: 40px 16px;
    text-align: center;
    color: var(--ink-soft);
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 15px;
  }

  /* Controls */
  .controls {
    width: 100%;
    max-width: 720px;
    align-self: center;
    padding-top: 24px;
    border-top: 1px solid var(--line-strong);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .row .play-btn { padding: 18px 16px; }
  .row .icon-btn { width: 52px; height: 52px; }

  .play-btn {
    flex: 1;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 18px 24px;
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
    border-radius: 0;
  }
  .play-btn:active { transform: scale(0.98); background: var(--accent); }

  .icon-btn {
    width: 56px;
    height: 56px;
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    transition: background 0.15s, color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:active { background: var(--ink); color: var(--paper); }

  .speed-control {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 8px 0;
  }
  .speed-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    min-width: 60px;
  }
  .speed-value {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 700;
    font-variation-settings: "opsz" 144;
    min-width: 90px;
    text-align: center;
  }
  .speed-value small {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 400;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
    display: block;
    margin-top: -4px;
  }
  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 3px;
    background: var(--line-strong);
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    background: var(--accent);
    cursor: pointer;
    border-radius: 50%;
  }
  input[type="range"]::-moz-range-thumb {
    width: 22px;
    height: 22px;
    background: var(--accent);
    cursor: pointer;
    border-radius: 50%;
    border: none;
  }

  /* Library panel (also reused by the Chapters and Bookmarks panels) */
  .panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    background: var(--paper);
    z-index: 100;
    display: none;
    flex-direction: column;
    padding: env(safe-area-inset-top, 20px) 24px env(safe-area-inset-bottom, 20px);
    animation: slideUp 0.3s ease;
    -webkit-overflow-scrolling: touch;
  }
  .panel.open { display: flex; }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 4px 20px;
    border-bottom: 1px solid var(--line-strong);
    margin-bottom: 20px;
  }
  .panel-title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 700;
    font-style: italic;
    font-variation-settings: "opsz" 144;
  }
  .close-btn {
    background: transparent;
    border: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    cursor: pointer;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px 12px;
  }
  .panel-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 16px;
  }
  .panel-actions .import-row {
    display: flex;
    gap: 12px;
  }
  .panel-actions .import-row > * { flex: 1; }
  .sample-btn {
    background: transparent;
    border: 1px solid var(--ink);
    padding: 18px 24px;
    font-family: 'Fraunces', serif;
    font-size: 14px;
    font-style: italic;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, opacity 0.15s;
  }
  .sample-btn:active { background: var(--ink); color: var(--paper); }
  .sample-btn:disabled { opacity: 0.5; cursor: wait; }

  /* Empty state */
  .empty-hint {
    color: var(--ink-soft);
    font-style: italic;
    font-size: min(28px, max(20px, 3.5vw));
    font-weight: 300;
    text-align: center;
  }

  /* Tap zones for navigation */
  .tap-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    z-index: 5;
    cursor: pointer;
    background: transparent;
    border: none;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .tap-zone:focus { outline: none; }
  .tap-zone:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -4px;
  }
  .tap-zone:active { background: rgba(231, 76, 60, 0.04); }
  /* Align tap zones with the word frame (max-width: 720px, centered) so the
     middle stays clickable for focus toggle even on wide screens. On narrow
     viewports the calc resolves below 25%, so the max() keeps the original
     phone behavior. */
  .tap-zone.left {
    left: 0;
    width: max(25%, calc(50% - 360px));
  }
  .tap-zone.right {
    right: 0;
    width: max(25%, calc(50% - 360px));
  }
  .tap-zone.center {
    left: 50%;
    transform: translateX(-50%);
    width: min(50%, 720px);
  }

  /* Focus mode — hide everything except the word and progress bar */
  body.focus-mode .controls,
  body.focus-mode .progress-label { display: none; }
  body.focus-mode .word {
    /* Same adaptive pattern as the regular word, scaled ~+25%: floor 36→48,
       ideal 9vw, cap 96. */
    font-size: min(96px, max(min(48px, max(36px, 10vw)), 9vw));
  }
</style>
</head>
<body>

  <div class="logo">Speed<span>Reader</span></div>
  <div class="stats" id="stats">— · —</div>
</header> -->

<div class="stage">
  <button class="tap-zone left" id="tapLeft" aria-label="Skip back" type="button"></button>
  <button class="tap-zone right" id="tapRight" aria-label="Play or pause" type="button"></button>
  <button class="tap-zone center" id="tapCenter" aria-label="Toggle focus mode" type="button"></button>

  <div class="word-frame">
    <div class="word" id="word">
      <span class="empty-hint">import an epub<br>to begin</span>
    </div>
  </div>

  <div class="progress">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="progress-label" id="progressLabel">0 / 0</div>
</div>

<div class="controls">
  <button class="chapter-bar" id="chapterBar" aria-label="View chapters">
    <div class="chapter-meta">
      <span class="book-title-text" id="bookTitleText">—</span>
      <span class="chapter-counter" id="chapterCounter">— / —</span>
    </div>
    <div class="chapter-title-text" id="chapterTitle">—</div>
  </button>

  <div class="speed-control">
    <span class="speed-label">Speed</span>
    <input type="range" id="speed" min="150" max="800" step="25" value="350">
    <div class="speed-value">
      <span id="speedNum">350</span>
      <small>WPM</small>
    </div>
  </div>

  <div class="row">
    <button class="icon-btn" id="rewindBtn" aria-label="Rewind">‹‹</button>
    <button class="play-btn" id="playBtn">Start</button>
    <button class="icon-btn" id="bookmarkBtn" aria-label="Bookmarks">🔖</button>
    <button class="icon-btn" id="textBtn" aria-label="Library">LOAD</button>
  </div>
</div>

<div class="panel" id="panel">
  <div class="panel-header">
    <div class="panel-title">Library</div>
    <button class="close-btn" id="closePanelBtn">Close ✕</button>
  </div>
  <div class="toc-list" id="libraryList"></div>
  <div class="panel-actions">
    <div class="import-row">
      <button class="sample-btn" id="epubBtn">Import EPUB</button>
      <button class="sample-btn" id="sampleBtn">Sample text</button>
    </div>
  </div>
  <input type="file" accept=".epub,application/epub+zip" id="epubInput" hidden>
</div>

<div class="panel" id="tocPanel">
  <div class="panel-header">
    <div class="panel-title">Chapters</div>
    <button class="close-btn" id="closeTocBtn">Close ✕</button>
  </div>
  <div class="toc-list" id="tocList"></div>
</div>

<div class="panel" id="bookmarksPanel">
  <div class="panel-header">
    <div class="panel-title">Bookmarks</div>
    <button class="close-btn" id="closeBookmarksBtn">Close ✕</button>
  </div>
  <button class="add-bookmark-btn" id="addBookmarkBtn">🔖 Save current position</button>
  <div class="toc-list" id="bookmarkList"></div>
</div>

<script>
  // --- State ---
  let words = [];
  let chapters = [];           // [{title, start, end}] word indices, empty when no TOC
  let bookmarks = [];          // [{index, chapterIdx, chapterTitle, percent, savedAt}]
  let bookTitle = '';
  let cursor = 0;
  let playing = false;
  let timer = null;
  let wpm = 350;

  const wordEl = document.getElementById('word');
  // Captured from the markup rather than restated, so the hint the stage falls
  // back to is by construction the same one the page ships with.
  const EMPTY_HINT_HTML = wordEl.innerHTML;
  const playBtn = document.getElementById('playBtn');
  const rewindBtn = document.getElementById('rewindBtn');
  const textBtn = document.getElementById('textBtn');
  const speedSlider = document.getElementById('speed');
  const speedNum = document.getElementById('speedNum');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const stats = document.getElementById('stats');
  const panel = document.getElementById('panel');
  const closePanelBtn = document.getElementById('closePanelBtn');
  const libraryList = document.getElementById('libraryList');
  const sampleBtn = document.getElementById('sampleBtn');
  const tapLeft = document.getElementById('tapLeft');
  const tapRight = document.getElementById('tapRight');
  const tapCenter = document.getElementById('tapCenter');
  const epubBtn = document.getElementById('epubBtn');
  const epubInput = document.getElementById('epubInput');
  const chapterBar = document.getElementById('chapterBar');
  const chapterTitle = document.getElementById('chapterTitle');
  const chapterCounter = document.getElementById('chapterCounter');
  const bookTitleText = document.getElementById('bookTitleText');
  const tocPanel = document.getElementById('tocPanel');
  const tocList = document.getElementById('tocList');
  const closeTocBtn = document.getElementById('closeTocBtn');
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  const bookmarksPanel = document.getElementById('bookmarksPanel');
  const closeBookmarksBtn = document.getElementById('closeBookmarksBtn');
  const addBookmarkBtn = document.getElementById('addBookmarkBtn');
  const bookmarkList = document.getElementById('bookmarkList');

  // Optimal Recognition Point — pivot letter index based on word length
  function pivotIndex(word) {
    const len = word.length;
    if (len <= 1) return 0;
    if (len <= 5) return 1;
    if (len <= 9) return 2;
    if (len <= 13) return 3;
    return 4;
  }

  // Render a word with the pivot letter aligned to center
  function renderWord(w) {
    if (!w) {
      wordEl.innerHTML = '<span class="empty-hint">end of text</span>';
      wordEl.style.transform = 'translateX(0)';
      return;
    }
    const p = pivotIndex(w);
    const left = w.slice(0, p);
    const pivot = w.slice(p, p + 1);
    const right = w.slice(p + 1);
    wordEl.innerHTML =
      '<span class="left">' + escapeHtml(left) + '</span>' +
      '<span class="pivot">' + escapeHtml(pivot) + '</span>' +
      '<span class="right">' + escapeHtml(right) + '</span>';

    // Align pivot character to center of frame, but clamp the offset so the
    // word never extends past the .word-frame edges (otherwise body's
    // overflow:hidden clips the right side on narrow viewports for long
    // words like "computadora" or "responsabilidad").
    const pivotEl = wordEl.querySelector('.pivot');
    const wordRect = wordEl.getBoundingClientRect();
    const pivotRect = pivotEl.getBoundingClientRect();
    const frameRect = wordEl.parentElement.getBoundingClientRect();
    const pivotCenter = pivotRect.left + pivotRect.width / 2;
    const wordCenter = wordRect.left + wordRect.width / 2;
    let offset = wordCenter - pivotCenter;

    const slack = (frameRect.width - wordRect.width) / 2;
    if (slack >= 0) {
      // Word fits — apply ORP offset, clamped so word stays within frame
      offset = Math.max(-slack, Math.min(slack, offset));
    } else {
      // Word wider than frame — center it (symmetric overflow beats clipped
      // ORP overflow); accept that the pivot won't sit at the frame center
      offset = 0;
    }
    wordEl.style.transform = 'translateX(' + offset + 'px)';
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // Smart pacing — pause longer on punctuation and long words
  function delayFor(word) {
    const base = 60000 / wpm; // ms per word
    let factor = 1;
    if (/[.!?]$/.test(word)) factor = 2.2;
    else if (/[,;:]$/.test(word)) factor = 1.6;
    else if (word.length > 9) factor = 1.4;
    else if (word.length > 6) factor = 1.15;
    return base * factor;
  }

  function updateUI() {
    const total = words.length;
    progressLabel.textContent = (Math.min(cursor, total)) + ' / ' + total;
    progressFill.style.width = total ? (Math.min(cursor, total) / total * 100) + '%' : '0%';
    const ci = currentChapterIdx();
    if (ci >= 0 && chapterBar.classList.contains('visible')) {
      const ch = chapters[ci];
      chapterTitle.textContent = ch.title || `Chapter ${ci + 1}`;
      chapterCounter.textContent = `${ci + 1} / ${chapters.length}`;
      bookTitleText.textContent = bookTitle || 'Book';
    }
    if (!stats) return;
    if (total) {
      const remainingWords = Math.max(total - cursor, 0);
      const minsLeft = remainingWords / wpm;
      const m = Math.floor(minsLeft);
      const s = Math.round((minsLeft - m) * 60);
      stats.textContent = total + ' words · ' + (m > 0 ? m + 'm ' : '') + s + 's';
    } else {
      stats.textContent = '— · —';
    }
  }

  function tick() {
    if (cursor >= words.length) {
      stop();
      renderWord(null);
      updateUI();
      return;
    }
    const w = words[cursor];
    renderWord(w);
    updateUI();
    if (cursor % 30 === 0) persistProgress();
    const d = delayFor(w);
    cursor++;
    timer = setTimeout(tick, d);
  }

  function play() {
    if (!words.length) {
      panel.classList.add('open');
      return;
    }
    if (cursor >= words.length) cursor = 0;
    playing = true;
    playBtn.textContent = 'Pause';
    tick();
  }

  function stop() {
    playing = false;
    playBtn.textContent = cursor >= words.length ? 'Restart' : 'Continue';
    if (timer) { clearTimeout(timer); timer = null; }
    persistProgress();
  }

  const SAMPLE_TEXT = "It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife. However little known the feelings or views of such a man may be on his first entering a neighbourhood, this truth is so well fixed in the minds of the surrounding families, that he is considered as the rightful property of some one or other of their daughters. \"My dear Mr. Bennet,\" said his lady to him one day, \"have you heard that Netherfield Park is let at last?\" Mr. Bennet replied that he had not. \"But it is,\" returned she; \"for Mrs. Long has just been here, and she told me all about it.\" Mr. Bennet made no answer. \"Do not you want to know who has taken it?\" cried his wife impatiently. \"You want to tell me, and I have no objection to hearing it.\"";

  // Ephemeral: no library row is created or touched. currentBookId is left
  // alone on purpose, so a reload during the demo returns to the real book.
  // currentRow === null suppresses only the row write — WPM changes still
  // write {wpm, currentBookId: <unchanged>} to settings, same as always;
  // WPM belongs to the reader, not the book, so the demo does not special-
  // case it.
  function loadSampleDemo() {
    flushProgress();
    currentRow = null;
    loadBook({ title: 'Sample text', chapters: [{ title: '', text: SAMPLE_TEXT }] });
    panel.classList.remove('open');
    play();
  }

  // The single definition of what a word is. countWords() and loadBook() must
  // agree exactly: wordCount comes from one and the reading cursor indexes the
  // other, so any drift between them would make every stored progress
  // percentage wrong.
  function tokenize(text) {
    return String(text || '').trim().split(/\s+/).filter(Boolean);
  }

  function loadBook(book, opts = {}) {
    const { restoredIndex = 0, restoredBookmarks = null } = opts;
    bookTitle = book.title || '';
    words = [];
    chapters = [];
    bookmarks = restoredBookmarks || [];
    let offset = 0;
    for (const ch of book.chapters) {
      const chWords = tokenize(ch.text);
      if (!chWords.length) continue;
      chapters.push({ title: ch.title || '', start: offset, end: offset + chWords.length });
      // Not words.push(...chWords): a single chapter above the engine's
      // spread-argument limit (~65k words in JSC) throws RangeError. A loop
      // has no such limit.
      for (let i = 0; i < chWords.length; i++) words.push(chWords[i]);
      offset += chWords.length;
    }
    const hasRealChapters = chapters.length > 1 || (chapters[0] && chapters[0].title);
    chapterBar.classList.toggle('visible', hasRealChapters);
    cursor = Math.max(0, Math.min(restoredIndex, words.length - 1));
    if (words.length) {
      renderWord(words[cursor]);
      playBtn.textContent = cursor > 0 ? 'Continue' : 'Start';
    }
    updateUI();
  }

  function currentChapterIdx() {
    if (!chapters.length) return -1;
    for (let i = chapters.length - 1; i >= 0; i--) {
      if (cursor >= chapters[i].start) return i;
    }
    return 0;
  }

  function jumpToChapter(idx) {
    if (idx < 0 || idx >= chapters.length) return;
    stop();
    cursor = chapters[idx].start;
    renderWord(words[cursor]);
    updateUI();
    persistProgress();
  }

  // --- Event listeners ---
  playBtn.addEventListener('click', () => {
    if (playing) stop();
    else play();
  });

  rewindBtn.addEventListener('click', () => {
    stop();
    cursor = Math.max(0, cursor - 11); // back ~10 words
    if (words[cursor]) renderWord(words[cursor]);
    updateUI();
    persistProgress();
  });

  textBtn.addEventListener('click', () => {
    stop();
    // stop() only arms the debounce; flush now so the list's percentage for
    // the open book isn't stale by up to 600ms.
    flushProgress();
    renderLibrary();
    panel.classList.add('open');
  });

  closePanelBtn.addEventListener('click', () => panel.classList.remove('open'));

  sampleBtn.addEventListener('click', loadSampleDemo);

  speedSlider.addEventListener('input', e => {
    wpm = parseInt(e.target.value);
    speedNum.textContent = wpm;
    updateUI();
    persistProgress();
  });

  // Tap left / right to skip back / forward
  tapLeft.addEventListener('click', () => {
    if (!words.length) return;
    stop();
    cursor = Math.max(0, cursor - 6);
    renderWord(words[cursor]);
    updateUI();
    persistProgress();
  });
  tapRight.addEventListener('click', () => {
    if (!words.length) return;
    playing ? stop() : play();
  });

  // Tap center to toggle focus mode (hides controls, larger type)
  function toggleFocusMode() {
    document.body.classList.toggle('focus-mode');
    // Re-render so the pivot stays centered after the font-size change
    if (words[cursor - 1]) renderWord(words[cursor - 1]);
    else if (words[0]) renderWord(words[0]);
  }
  tapCenter.addEventListener('click', toggleFocusMode);

  // Keyboard support
  document.addEventListener('keydown', e => {
    if (panel.classList.contains('open') || tocPanel.classList.contains('open')) return;
    if (e.code === 'Space') { e.preventDefault(); playing ? stop() : play(); }
    if (e.code === 'ArrowLeft') rewindBtn.click();
    if (e.code === 'Escape' && document.body.classList.contains('focus-mode')) toggleFocusMode();
  });

  // Auto-pause when the tab is hidden (app switch, lock screen, other tab).
  // Don't auto-resume on return — let the user tap to continue, so the word
  // they last saw stays visible while they get re-oriented.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && playing) stop();
  });

  // Re-center on resize
  window.addEventListener('resize', () => {
    if (words[cursor - 1]) renderWord(words[cursor - 1]);
    else if (words[0]) renderWord(words[0]);
  });

  // --- TOC ---
  function renderToc() {
    const ci = currentChapterIdx();
    const total = words.length;
    tocList.innerHTML = '';
    chapters.forEach((ch, i) => {
      const btn = document.createElement('button');
      btn.className = 'toc-item' + (i === ci ? ' current' : '');
      btn.innerHTML =
        '<span class="num">' + String(i + 1).padStart(2, '0') + '</span>' +
        '<span class="label"></span>' +
        '<span class="meta">' + Math.round((ch.start / Math.max(total, 1)) * 100) + '%</span>';
      btn.querySelector('.label').textContent = ch.title || `Chapter ${i + 1}`;
      btn.addEventListener('click', () => {
        jumpToChapter(i);
        tocPanel.classList.remove('open');
      });
      tocList.appendChild(btn);
    });
    // scroll current into view
    const cur = tocList.querySelector('.toc-item.current');
    if (cur) cur.scrollIntoView({ block: 'center' });
  }

  chapterBar.addEventListener('click', () => {
    if (!chapters.length) return;
    renderToc();
    tocPanel.classList.add('open');
  });
  closeTocBtn.addEventListener('click', () => tocPanel.classList.remove('open'));

  // --- Bookmarks ---
  function addBookmark() {
    if (!words.length) return;
    if (!currentRow) return;   // the sample demo owns no row
    if (bookmarks.some(b => b.index === cursor)) return; // skip exact duplicate
    const ci = currentChapterIdx();
    const ch = ci >= 0 ? chapters[ci] : null;
    bookmarks.unshift({
      index: cursor,
      chapterIdx: ci,
      chapterTitle: ch ? (ch.title || `Chapter ${ci + 1}`) : '',
      percent: Math.round((cursor / Math.max(words.length, 1)) * 100),
      savedAt: Date.now(),
    });
    renderBookmarks();
    flushProgress();
  }

  function removeBookmark(i) {
    bookmarks.splice(i, 1);
    renderBookmarks();
    flushProgress();
  }

  function jumpToBookmark(i) {
    const b = bookmarks[i];
    if (!b) return;
    stop();
    cursor = Math.max(0, Math.min(b.index, words.length - 1));
    renderWord(words[cursor]);
    updateUI();
    persistProgress();
  }

  function renderBookmarks() {
    addBookmarkBtn.disabled =
      !words.length || !currentRow || bookmarks.some(b => b.index === cursor);
    bookmarkList.innerHTML = '';
    if (!bookmarks.length) {
      const empty = document.createElement('div');
      empty.className = 'bookmark-empty';
      empty.textContent = 'No bookmarks yet';
      bookmarkList.appendChild(empty);
      return;
    }
    bookmarks.forEach((b, i) => {
      const row = document.createElement('div');
      row.className = 'bookmark-row';
      row.innerHTML =
        '<button class="bookmark-item">' +
          '<span class="icon">🔖</span>' +
          '<span class="label"></span>' +
          '<span class="meta">' + b.percent + '%</span>' +
        '</button>' +
        '<button class="bookmark-delete" aria-label="Delete">✕</button>';
      row.querySelector('.label').textContent = b.chapterTitle || 'Saved position';
      // Word index, not percent: two bookmarks in one chapter can round to the
      // same percent, and addBookmark already refuses duplicate indices.
      row.querySelector('.bookmark-delete').setAttribute(
        'aria-label',
        'Delete bookmark: ' + (b.chapterTitle || 'saved position') + ', word ' + (b.index + 1));
      row.querySelector('.bookmark-item').addEventListener('click', () => {
        jumpToBookmark(i);
        bookmarksPanel.classList.remove('open');
      });
      row.querySelector('.bookmark-delete').addEventListener('click', (e) => {
        e.stopPropagation();
        removeBookmark(i);
      });
      bookmarkList.appendChild(row);
    });
  }

  // --- Library ---
  function formatRowMeta(row) {
    const parts = [];
    if (row.author) parts.push(row.author);
    const total = row.wordCount || 0;
    const pct = total ? Math.round((row.cursor || 0) / total * 100) : 0;
    parts.push(pct + '%');
    const when = new Date(row.lastOpenedAt || row.addedAt || Date.now());
    parts.push(when.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }));
    return parts.join(' · ');
  }

  function clearStage() {
    stop();
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    words = [];
    chapters = [];
    bookmarks = [];
    bookTitle = '';
    cursor = 0;
    currentBookId = null;
    currentRow = null;
    chapterBar.classList.remove('visible');
    wordEl.innerHTML = EMPTY_HINT_HTML;
    wordEl.style.transform = 'translateX(0)';
    playBtn.textContent = 'Start';
    updateUI();
  }

  async function deleteBook(id) {
    const wasOpen = id === currentBookId;   // clearStage() nulls currentBookId
    if (wasOpen) clearStage();
    try {
      // Inside the try: a failing settings write must not abort the deletes
      // and leave the stage cleared, the book still listed, and the user
      // told nothing.
      if (wasOpen) await saveSettings();
      await dbDelete(STORE_LIBRARY, id);
      await dbDelete(STORE_BOOKS, id);
    } catch (e) {
      alert('Could not delete the book: ' + (e && e.message ? e.message : e));
    }
    renderLibrary();
  }

  let openInFlight = false;

  async function renderLibrary() {
    let rows;
    try {
      rows = await dbGetAll(STORE_LIBRARY);
    } catch (e) {
      // A transient IndexedDB failure must not render identically to a
      // genuinely empty library — surface it instead of swallowing to [].
      libraryList.innerHTML = '';
      const err = document.createElement('div');
      err.className = 'bookmark-empty';
      err.textContent = 'Could not load your library: ' + (e && e.message ? e.message : e);
      libraryList.appendChild(err);
      return;
    }
    rows.sort((a, b) => (b.lastOpenedAt || 0) - (a.lastOpenedAt || 0));
    libraryList.innerHTML = '';
    rows.forEach(r => {
      const row = document.createElement('div');
      row.className = 'bookmark-row';
      row.innerHTML =
        '<button class="bookmark-item book-item">' +
          '<span class="label"></span>' +
          '<span class="sub"></span>' +
        '</button>' +
        '<button class="bookmark-delete" aria-label="Delete">✕</button>';
      const item = row.querySelector('.bookmark-item');
      if (r.id === currentBookId) item.classList.add('current');
      row.querySelector('.label').textContent = r.title || 'Untitled';
      row.querySelector('.sub').textContent = formatRowMeta(r);
      row.querySelector('.bookmark-delete').setAttribute('aria-label', 'Delete ' + (r.title || 'this book'));
      item.addEventListener('click', async () => {
        if (openInFlight) return;
        openInFlight = true;
        panel.classList.remove('open');
        try {
          const ok = await openBookById(r.id);
          if (!ok) {
            if (confirm('This book\'s text is missing. Delete it from the library?')) {
              await deleteBook(r.id);
            }
            panel.classList.add('open');
          }
        } catch (e) {
          alert('Could not open this book: ' + (e && e.message ? e.message : e));
          panel.classList.add('open');
        } finally {
          openInFlight = false;
        }
      });
      row.querySelector('.bookmark-delete').addEventListener('click', async (e) => {
        e.stopPropagation();
        const name = r.title || 'this book';
        if (!confirm('Delete ' + name + '? This cannot be undone.')) return;
        await deleteBook(r.id);
      });
      libraryList.appendChild(row);
    });
  }

  bookmarkBtn.addEventListener('click', () => {
    renderBookmarks();
    bookmarksPanel.classList.add('open');
  });
  closeBookmarksBtn.addEventListener('click', () => bookmarksPanel.classList.remove('open'));
  addBookmarkBtn.addEventListener('click', addBookmark);

  // --- Persistence (IndexedDB) ---
  const DB_NAME = 'thoth';
  const DB_VERSION = 2;
  const STORE_BOOKS = 'books';
  const STORE_LIBRARY = 'library';
  const STORE_SETTINGS = 'settings';
  const SETTINGS_KEY = 'app';
  const LEGACY_KEY = 'current';
  let dbPromise;
  let dbBlockedWarned = false;

  function openDB() {
    if (!dbPromise) {
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE_BOOKS)) {
            db.createObjectStore(STORE_BOOKS);
          }
          if (!db.objectStoreNames.contains(STORE_LIBRARY)) {
            db.createObjectStore(STORE_LIBRARY, { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains(STORE_SETTINGS)) {
            db.createObjectStore(STORE_SETTINGS);
          }
        };
        // Fires when another tab holds an older connection open. It fires
        // neither onsuccess nor onerror, so without this the promise never
        // settles and the app hangs on an empty stage with no explanation.
        req.onblocked = () => {
          if (dbBlockedWarned) return;
          dbBlockedWarned = true;
          alert('Thoth is open in another tab. Close it and reload this page.');
        };
        req.onsuccess = () => {
          const db = req.result;
          // Let a future version upgrade proceed instead of blocking it the
          // way the v1 code blocks this one.
          db.onversionchange = () => db.close();
          resolve(db);
        };
        req.onerror = () => reject(req.error);
      });
    }
    return dbPromise;
  }
  async function dbGet(store, key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readonly');
      const req = tx.objectStore(store).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function dbGetAll(store) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readonly');
      const req = tx.objectStore(store).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }
  async function dbSet(store, value, key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readwrite');
      if (key === undefined) tx.objectStore(store).put(value);
      else tx.objectStore(store).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function dbDelete(store, key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  // --- Library records ---
  let currentBookId = null;
  // null in two distinct situations: the ephemeral sample demo is loaded, or
  // nothing is loaded at all. Both suppress the library row write; neither
  // should suppress the settings write (WPM, currentBookId) — see
  // writeRowNow.
  let currentRow = null;

  function countWords(chs) {
    let n = 0;
    for (const ch of chs) n += tokenize(ch.text).length;
    return n;
  }

  function makeRow(book) {
    const now = Date.now();
    return {
      id: book.id,
      title: book.title || '',
      author: book.author || '',
      wordCount: countWords(book.chapters),
      cursor: 0,
      bookmarks: [],
      addedAt: now,
      lastOpenedAt: now,
    };
  }

  // Text first, row second: if the text write fails there is never a library
  // row pointing at nothing.
  async function saveNewBook(book) {
    await dbSet(STORE_BOOKS, { chapters: book.chapters }, book.id);
    const row = makeRow(book);
    await dbSet(STORE_LIBRARY, row);
    return row;
  }

  async function loadSettings() {
    const s = await dbGet(STORE_SETTINGS, SETTINGS_KEY);
    if (!s) return { wpm: 350, currentBookId: null };
    return { wpm: s.wpm || 350, currentBookId: s.currentBookId || null };
  }

  // Never write settings we failed to read: on a boot where loadSettings()
  // throws, the module defaults (wpm 350, currentBookId null) are all we have,
  // and flushing those over a good stored record would lose the reader's
  // resume pointer. Deliberately not retried within the session — the choice
  // is "don't destroy what's stored" over "also save what's new", which for a
  // single-file app is the cheaper half of the trade.
  let settingsLoaded = false;

  async function saveSettings() {
    if (!settingsLoaded) return;
    await dbSet(STORE_SETTINGS, { wpm: wpm, currentBookId: currentBookId }, SETTINGS_KEY);
  }

  let saveTimer = null;
  // The row write is guarded on currentRow (no row while the demo is loaded
  // or nothing is loaded at all) but the settings write is not: WPM belongs
  // to the reader, not the book, and must persist in both of those cases too.
  async function writeRowNow() {
    saveTimer = null;
    try {
      if (currentRow) {
        currentRow.cursor = cursor;
        currentRow.bookmarks = bookmarks;
        await dbSet(STORE_LIBRARY, currentRow);
      }
      await saveSettings();
    } catch (e) { console.warn('progress save failed', e); }
  }
  function flushProgress() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    writeRowNow();
  }
  function persistProgress() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(writeRowNow, 600);
  }

  async function openBookById(id, opts) {
    const autoplay = !!(opts && opts.autoplay);
    flushProgress();
    const row = await dbGet(STORE_LIBRARY, id);
    if (!row) return false;
    const rec = await dbGet(STORE_BOOKS, id);
    if (!rec || !Array.isArray(rec.chapters) || !rec.chapters.length) return false;
    currentBookId = id;
    currentRow = row;
    row.lastOpenedAt = Date.now();
    loadBook({ title: row.title, chapters: rec.chapters }, {
      restoredIndex: row.cursor || 0,
      restoredBookmarks: Array.isArray(row.bookmarks) ? row.bookmarks : [],
    });
    // The book is already on stage by this point, so a failure here is a
    // failed save, not a failed open — report it the way progress saves are
    // reported rather than telling the caller the book did not open.
    try {
      await dbSet(STORE_LIBRARY, row);
      await saveSettings();
    } catch (e) { console.warn('open-book save failed', e); }
    if (autoplay) play();
    return true;
  }

  // Runs at startup rather than inside onupgradeneeded: the versionchange
  // transaction is the fragile place to do this, and a failure here must not
  // take the app down with it.
  async function migrateV1() {
    const saved = await dbGet(STORE_BOOKS, LEGACY_KEY);
    if (!saved || !Array.isArray(saved.chapters) || !saved.chapters.length) return;
    // A v1 record without a title came from the removed paste flow. Title it
    // from its own first words rather than discarding someone's reading.
    let title = saved.title || '';
    if (!title) title = titleFromText(saved.chapters[0].text || '');
    const id = deriveBookId({ identifier: '', title: title, author: '', fileName: '' });
    // If the library row already exists, a previous run of this migration
    // completed its writes but was interrupted before the legacy delete
    // landed. Re-running the writes would stomp the row's real cursor and
    // bookmarks with this stale v1 snapshot, discarding everything read
    // since. One dbGet distinguishes that from a genuinely fresh migration
    // (and from an orphaned text-only write with no row yet) — only the
    // latter two should write.
    const existingRow = await dbGet(STORE_LIBRARY, id);
    if (!existingRow) {
      await dbSet(STORE_BOOKS, { chapters: saved.chapters }, id);
      const when = saved.savedAt || Date.now();
      await dbSet(STORE_LIBRARY, {
        id: id,
        title: title,
        author: '',
        wordCount: countWords(saved.chapters),
        cursor: saved.index || 0,
        bookmarks: Array.isArray(saved.bookmarks) ? saved.bookmarks : [],
        addedAt: when,
        lastOpenedAt: when,
      });
      await dbSet(STORE_SETTINGS, {
        wpm: saved.wpm || 350,
        currentBookId: id,
      }, SETTINGS_KEY);
    }
    // Last, so any earlier failure leaves 'current' in place for a retry.
    await dbDelete(STORE_BOOKS, LEGACY_KEY);
  }

  async function initApp() {
    try {
      // Scoped to itself: a migration failure must cost only the migration,
      // not suppress settings/currentBookId restore on every subsequent boot
      // (the legacy record is deliberately left in place on failure, so a
      // shared try/catch here would repeat the failure forever).
      try {
        await migrateV1();
      } catch (e) { console.warn('migration failed; will retry next boot', e); }
      const s = await loadSettings();
      settingsLoaded = true;
      wpm = s.wpm;
      speedSlider.value = wpm;
      speedNum.textContent = wpm;
      if (s.currentBookId) {
        // Hold the stored pointer while the open is attempted. If openBookById
        // throws — a transient read failure rather than a missing book — the
        // outer catch leaves it intact, so the next settings write preserves
        // the resume pointer instead of nulling it. Only a deliberate false,
        // meaning the row or its text is genuinely gone, clears it.
        currentBookId = s.currentBookId;
        const ok = await openBookById(s.currentBookId, { autoplay: false });
        if (!ok) currentBookId = null;
      }
    } catch (e) {
      // settingsLoaded tells you which half failed: false means loadSettings()
      // itself threw and no settings will be written this session; true means
      // the book open failed but the stored pointer was preserved.
      console.warn('boot failed (settingsLoaded=' + settingsLoaded + ')', e);
    }
  }
  initApp();
  // Not gated on currentRow: a pending WPM change must still be written even
  // with no row loaded (see writeRowNow).
  window.addEventListener('beforeunload', () => { writeRowNow(); });

  // --- EPUB import ---
  let jszipPromise;
  function loadJSZip() {
    if (window.JSZip) return Promise.resolve(window.JSZip);
    if (!jszipPromise) {
      jszipPromise = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'jszip.min.js';
        s.onload = () => resolve(window.JSZip);
        s.onerror = () => reject(new Error('Could not load JSZip'));
        document.head.appendChild(s);
      });
    }
    return jszipPromise;
  }

  // --- Book identity ---
  function normalizePart(s) {
    if (!s) return '';
    return String(s).trim().toLowerCase().replace(/\s+/g, ' ');
  }
  function normalizeIdentifier(s) {
    return normalizePart(s).replace(/^urn:(isbn|uuid):/, '');
  }
  function titleFromText(text) {
    const words = String(text || '').trim().split(/\s+/).filter(Boolean).slice(0, 6);
    const joined = words.join(' ');
    return joined.length > 60 ? joined.slice(0, 60).trim() : joined;
  }
  // First rule that yields a usable value wins. Ids are opaque strings:
  // no prefix, no namespace.
  function deriveBookId(meta) {
    const ident = normalizeIdentifier(meta.identifier || '');
    if (ident.length >= 4) return ident;
    const t = normalizePart(meta.title || '');
    if (t) return t + '|' + normalizePart(meta.author || '');
    const fromFile = normalizePart(String(meta.fileName || '').replace(/\.epub$/i, ''));
    if (fromFile) return fromFile;
    return 'book-' + Date.now().toString(36);
  }

  async function parseEpub(file) {
    const JSZip = await loadJSZip();
    const zip = await JSZip.loadAsync(file);

    const containerFile = zip.file('META-INF/container.xml');
    if (!containerFile) throw new Error('Invalid EPUB: missing container.xml');
    const containerXml = await containerFile.async('string');
    const containerDoc = new DOMParser().parseFromString(containerXml, 'application/xml');
    const rootfile = containerDoc.querySelector('rootfile');
    if (!rootfile) throw new Error('Invalid EPUB: missing rootfile');
    const opfPath = rootfile.getAttribute('full-path');

    const opfFile = zip.file(opfPath);
    if (!opfFile) throw new Error('OPF not found');
    const opfXml = await opfFile.async('string');
    const opfDoc = new DOMParser().parseFromString(opfXml, 'application/xml');
    const opfDir = opfPath.includes('/') ? opfPath.substring(0, opfPath.lastIndexOf('/') + 1) : '';

    // Resolve a path relative to a base dir to an absolute path within the ZIP.
    // Handles `..` and `.` segments — needed when NCX and OPF live in
    // different directories and NCX content[src] uses `../` to reach
    // chapter files relative to the NCX rather than the OPF.
    function resolvePath(baseDir, relative) {
      const segs = (baseDir + relative).split('/');
      const out = [];
      for (const s of segs) {
        if (s === '..') out.pop();
        else if (s !== '' && s !== '.') out.push(s);
      }
      return out.join('/');
    }

    const titleEl = opfDoc.querySelector('metadata > [*|title], metadata > title');
    const rawTitle = titleEl && titleEl.textContent ? titleEl.textContent.trim() : '';
    const bookTitle = rawTitle || file.name.replace(/\.epub$/i, '');

    const creatorEl = opfDoc.querySelector('metadata > [*|creator], metadata > creator');
    const author = creatorEl && creatorEl.textContent ? creatorEl.textContent.trim() : '';
    // The package element names which identifier is canonical. EPUBs commonly
    // carry several — an ISBN plus an internal UUID — and document order is
    // not the answer. Fall back to the first when the pointer is absent or
    // dangling.
    const IDENT_SEL = 'metadata > [*|identifier], metadata > identifier';
    const pkgEl = opfDoc.querySelector('package');
    const uniqueId = pkgEl ? pkgEl.getAttribute('unique-identifier') : '';
    let identEl = null;
    if (uniqueId) {
      const allIdents = opfDoc.querySelectorAll(IDENT_SEL);
      for (let i = 0; i < allIdents.length; i++) {
        if (allIdents[i].getAttribute('id') === uniqueId) { identEl = allIdents[i]; break; }
      }
    }
    if (!identEl) identEl = opfDoc.querySelector(IDENT_SEL);
    const identifier = identEl && identEl.textContent ? identEl.textContent.trim() : '';

    const manifest = {};
    opfDoc.querySelectorAll('manifest > item').forEach(item => {
      manifest[item.getAttribute('id')] = item.getAttribute('href');
    });

    const spineRefs = Array.from(opfDoc.querySelectorAll('spine > itemref'))
      .map(ref => manifest[ref.getAttribute('idref')])
      .filter(Boolean);

    // Build a map of file → chapter title from the NCX (canonical EPUB TOC).
    // First navPoint pointing to each file wins. Falls back to per-file
    // <h1>/<title> when the NCX has no entry (or no NCX exists).
    const ncxTitles = {};
    const spineEl = opfDoc.querySelector('spine');
    const ncxId = spineEl && spineEl.getAttribute('toc');
    const ncxHref = ncxId && manifest[ncxId];
    if (ncxHref) {
      const ncxPath = resolvePath(opfDir, ncxHref);
      const ncxDir = ncxPath.includes('/') ? ncxPath.substring(0, ncxPath.lastIndexOf('/') + 1) : '';
      const ncxFile = zip.file(ncxPath);
      if (ncxFile) {
        try {
          const ncxXml = await ncxFile.async('string');
          const ncxDoc = new DOMParser().parseFromString(ncxXml, 'application/xml');
          ncxDoc.querySelectorAll('navPoint').forEach(np => {
            const labelEl = np.querySelector('navLabel > text');
            const contentEl = np.querySelector('content');
            const label = labelEl && labelEl.textContent ? labelEl.textContent.trim() : '';
            const src = contentEl ? contentEl.getAttribute('src') || '' : '';
            if (label && src) {
              // Resolve NCX-relative src to absolute path within the ZIP so the
              // key matches what the spine loop computes for each file.
              const absPath = resolvePath(ncxDir, decodeURIComponent(src.split('#')[0]));
              if (!ncxTitles[absPath]) ncxTitles[absPath] = label;
            }
          });
        } catch (e) { /* malformed NCX — silently fall back */ }
      }
    }

    function isPlaceholderTitle(s) {
      if (!s) return true;
      const t = s.trim().toLowerCase();
      return t.length < 2 || t === 'unknown' || t === 'untitled' || t === 'no title';
    }
    function decodeNumericEntities(s) {
      if (!s || s.indexOf('&#') === -1) return s;
      return s
        .replace(/&#(\d+);/g, (_, n) => String.fromCharCode(parseInt(n, 10)))
        .replace(/&#x([\da-fA-F]+);/g, (_, n) => String.fromCharCode(parseInt(n, 16)));
    }

    function fallbackTitleFor(doc, ordinal) {
      const headingEl = doc.querySelector('h1, h2, h3');
      const headingRaw = headingEl && headingEl.textContent
        ? headingEl.textContent.replace(/\s+/g, ' ').trim() : '';
      const titleEl = doc.querySelector('title');
      const titleRaw = titleEl && titleEl.textContent ? titleEl.textContent.trim() : '';
      const headingText = decodeNumericEntities(isPlaceholderTitle(headingRaw) ? '' : headingRaw);
      const titleText = decodeNumericEntities(isPlaceholderTitle(titleRaw) ? '' : titleRaw);
      return (titleText.length > headingText.length ? titleText : headingText)
        || `Chapter ${ordinal}`;
    }

    // When the NCX is present, group consecutive spine files under the same
    // chapter: each NCX entry begins a new chapter; files between are appended
    // to the previous chapter's text. This collapses Calibre's per-page splits
    // (e.g. 40 separate "notas" files) into one logical chapter that matches
    // the book's printed structure.
    const hasNcx = Object.keys(ncxTitles).length > 0;
    const chapters = [];
    let currentChapter = null;
    let ordinal = 0;
    for (const href of spineRefs) {
      const fileOnly = decodeURIComponent(href.split('#')[0]);
      const path = resolvePath(opfDir, fileOnly);
      const f = zip.file(path);
      if (!f) continue;
      const xhtml = await f.async('string');
      const doc = new DOMParser().parseFromString(xhtml, 'text/html');
      doc.querySelectorAll('script, style').forEach(el => el.remove());
      const text = ((doc.body && doc.body.textContent) || '').replace(/\s+/g, ' ').trim();
      if (!text) continue;
      ordinal++;

      const ncxLabel = ncxTitles[path] || '';

      if (hasNcx) {
        if (ncxLabel) {
          currentChapter = { title: ncxLabel.slice(0, 120), text };
          chapters.push(currentChapter);
        } else if (currentChapter) {
          currentChapter.text += ' ' + text;
        } else {
          // Front matter before the first NCX entry — give it its own chapter
          const title = fallbackTitleFor(doc, chapters.length + 1);
          currentChapter = { title: title.slice(0, 120), text };
          chapters.push(currentChapter);
        }
      } else {
        // No NCX — every spine file is its own chapter
        const title = ncxLabel || fallbackTitleFor(doc, ordinal);
        chapters.push({ title: title.slice(0, 120), text });
      }
    }

    if (!chapters.length) throw new Error('No readable text found');
    return {
      id: deriveBookId({
        identifier: identifier,
        title: rawTitle,
        author: author,
        fileName: file.name,
      }),
      title: bookTitle,
      author: author,
      chapters: chapters,
    };
  }

  epubBtn.addEventListener('click', () => epubInput.click());
  const MAX_EPUB_MB = 100; // guards against IndexedDB quota errors
  const MAX_EPUB_SIZE = MAX_EPUB_MB * 1024 * 1024;

  // dc:identifier is unreliable — Calibre and friends reuse one UUID across
  // every book in an export. A dedupe hit is only honored when the stored
  // title agrees; otherwise the import gets a disambiguated id.
  async function resolveImportId(book) {
    const wanted = normalizePart(book.title);
    let n = 1;
    for (;;) {
      const candidate = n === 1 ? book.id : book.id + '#' + n;
      const row = await dbGet(STORE_LIBRARY, candidate);
      if (!row) return { id: candidate, existing: null };
      if (normalizePart(row.title) === wanted) return { id: candidate, existing: row };
      n++;
    }
  }

  epubInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > MAX_EPUB_SIZE) {
      const sizeMb = (file.size / 1024 / 1024).toFixed(1);
      alert('File too large (' + sizeMb + ' MB). Max supported: ' + MAX_EPUB_MB + ' MB.');
      epubInput.value = '';
      return;
    }
    const original = epubBtn.textContent;
    epubBtn.textContent = 'Processing…';
    epubBtn.disabled = true;
    try {
      const book = await parseEpub(file);
      flushProgress();
      const resolved = await resolveImportId(book);
      if (resolved.existing) {
        panel.classList.remove('open');
        const opened = await openBookById(resolved.id, { autoplay: true });
        if (opened) {
          renderLibrary();
          return;
        }
        // The row is there but its text is not. The file the reader just
        // picked is right here, so drop the stale row and import it fresh —
        // otherwise choosing a file does nothing at all, with no explanation.
        await deleteBook(resolved.id);
      }
      book.id = resolved.id;
      let row;
      try {
        row = await saveNewBook(book);
      } catch (saveErr) {
        const quota = saveErr && saveErr.name === 'QuotaExceededError';
        alert(quota
          ? 'No space left on this device. Delete a book and try again.'
          : 'Could not save the book: ' + (saveErr && saveErr.message ? saveErr.message : saveErr));
        return;
      }
      currentBookId = row.id;
      currentRow = row;
      loadBook({ title: book.title, chapters: book.chapters });
      await saveSettings();
      panel.classList.remove('open');
      play();
      renderLibrary();
    } catch (err) {
      alert('Could not read EPUB: ' + err.message);
    } finally {
      epubBtn.textContent = original;
      epubBtn.disabled = false;
      epubInput.value = '';
    }
  });

  // Service worker — caches app shell for full offline use after first load
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
