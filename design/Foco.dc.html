      <span style="flex: 0 0 auto; color: #ef5a4a;">u</span>
      <span style="flex: 1 1 0; text-align: left;">script</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: #1a1611; overflow: hidden;">
